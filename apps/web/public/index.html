<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WRO Timeclock Punch</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #f3f4f6;
        color: #111827;
      }
      main {
        max-width: 720px;
        margin: 2rem auto;
        padding: 0 1rem 2rem;
      }
      .card {
        background: #fff;
        border-radius: 14px;
        padding: 1.2rem;
        box-shadow: 0 10px 24px rgba(17, 24, 39, 0.08);
        margin-bottom: 1rem;
      }
      h1, h2 { margin: 0 0 0.75rem; }
      .muted { color: #6b7280; margin: 0 0 1rem; }
      label { display: block; margin: 0.75rem 0 0.3rem; font-weight: 600; }
      input, select, textarea, button {
        width: 100%;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        padding: 0.65rem 0.75rem;
        font: inherit;
      }
      textarea { min-height: 90px; resize: vertical; }
      button {
        cursor: pointer;
        background: #2563eb;
        color: #fff;
        border-color: #2563eb;
        font-weight: 600;
      }
      button.secondary {
        background: #fff;
        color: #111827;
      }
      .row { display: grid; gap: 0.8rem; }
      @media (min-width: 700px) {
        .row.two { grid-template-columns: 1fr 1fr; }
      }
      .status-pill {
        display: inline-block;
        padding: 0.35rem 0.7rem;
        border-radius: 999px;
        font-weight: 700;
        background: #e5e7eb;
      }
      .status-pill.in { background: #dcfce7; color: #166534; }
      .status-pill.out { background: #fee2e2; color: #991b1b; }
      .message { margin-top: 0.8rem; min-height: 1.3rem; }
      .ok { color: #047857; }
      .err { color: #b91c1c; }
      pre {
        margin: 0;
        background: #111827;
        color: #e5e7eb;
        border-radius: 10px;
        padding: 0.75rem;
        overflow: auto;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1rem;
      }
      .topbar a { color: #2563eb; font-weight: 600; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="topbar">
        <h1>Punch Clock</h1>
        <a href="/admin.html">Admin</a>
      </div>

      <section class="card">
        <h2>1) Authenticate PIN</h2>
        <p class="muted">Calls <code>POST /api/auth/pin</code>.</p>
        <form id="auth-form">
          <label for="pin">PIN</label>
          <input id="pin" name="pin" type="password" autocomplete="one-time-code" required />
          <div class="row two" style="margin-top: 0.8rem">
            <button type="submit">Get session token</button>
            <button type="button" class="secondary" id="logout">Clear token</button>
          </div>
        </form>
        <div id="auth-message" class="message"></div>
      </section>

      <section class="card">
        <h2>2) Submit punch</h2>
        <p class="muted">Calls <code>POST /api/punch</code> with Bearer token.</p>
        <form id="punch-form" class="row">
          <div class="row two">
            <div>
              <label for="type">Type</label>
              <select id="type" name="type">
                <option value="IN">IN</option>
                <option value="OUT">OUT</option>
              </select>
            </div>
            <div>
              <label for="note">Note</label>
              <input id="note" name="note" type="text" placeholder="Optional" />
            </div>
          </div>
          <button type="submit">Submit punch</button>
        </form>
        <div id="punch-message" class="message"></div>
      </section>

      <section class="card">
        <h2>Session state</h2>
        <p>
          Token present: <span id="token-state" class="status-pill out">NO</span>
        </p>
        <pre id="response-view">No API response yet.</pre>
      </section>
    </main>

    <script>
      const TOKEN_KEY = 'timeclock_token';
      const authForm = document.getElementById('auth-form');
      const punchForm = document.getElementById('punch-form');
      const logoutButton = document.getElementById('logout');
      const authMessage = document.getElementById('auth-message');
      const punchMessage = document.getElementById('punch-message');
      const responseView = document.getElementById('response-view');
      const tokenState = document.getElementById('token-state');

      function getToken() {
        return sessionStorage.getItem(TOKEN_KEY) || '';
      }

      function setToken(token) {
        if (token) {
          sessionStorage.setItem(TOKEN_KEY, token);
        } else {
          sessionStorage.removeItem(TOKEN_KEY);
        }
        renderTokenState();
      }

      function renderTokenState() {
        const hasToken = Boolean(getToken());
        tokenState.textContent = hasToken ? 'YES' : 'NO';
        tokenState.classList.toggle('in', hasToken);
        tokenState.classList.toggle('out', !hasToken);
      }

      function setMessage(element, text, ok) {
        element.textContent = text || '';
        element.className = `message ${ok ? 'ok' : 'err'}`;
      }

      async function apiFetch(path, options = {}) {
        const token = getToken();
        const headers = {
          'Content-Type': 'application/json',
          ...(token ? { Authorization: `Bearer ${token}` } : {}),
          ...(options.headers || {}),
        };

        const response = await fetch(path, { ...options, headers });
        const data = await response.json().catch(() => ({}));
        responseView.textContent = JSON.stringify(data, null, 2);

        if (!response.ok) {
          throw new Error(data.message || `Request failed (${response.status})`);
        }
        return data;
      }

      authForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        setMessage(authMessage, '', true);
        const pin = authForm.pin.value;

        try {
          const payload = await apiFetch('/api/auth/pin', {
            method: 'POST',
            body: JSON.stringify({ pin }),
          });
          setToken(payload.token || '');
          setMessage(authMessage, 'Authenticated. Token saved for this tab session.', true);
          authForm.reset();
        } catch (error) {
          setMessage(authMessage, error.message, false);
        }
      });

      punchForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        setMessage(punchMessage, '', true);

        if (!getToken()) {
          setMessage(punchMessage, 'Authenticate with PIN first.', false);
          return;
        }

        const payload = {
          type: punchForm.type.value,
          note: punchForm.note.value.trim(),
        };

        try {
          await apiFetch('/api/punch', {
            method: 'POST',
            body: JSON.stringify(payload),
          });
          setMessage(punchMessage, 'Punch submitted successfully.', true);
          punchForm.note.value = '';
        } catch (error) {
          setMessage(punchMessage, error.message, false);
        }
      });

      logoutButton.addEventListener('click', () => {
        setToken('');
        setMessage(authMessage, 'Token cleared.', true);
      });

      renderTokenState();
    </script>
  </body>
</html>
