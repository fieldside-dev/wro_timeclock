<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WRO Timeclock</title>
    <style>
      body {
        font-family: "Inter", system-ui, sans-serif;
        margin: 0;
        padding: 3rem;
        background: #f7f7fb;
        color: #1f2933;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        background: #ffffff;
        padding: 2.5rem;
        border-radius: 16px;
        box-shadow: 0 24px 48px rgba(15, 23, 42, 0.08);
      }
      h1 {
        margin-top: 0;
        font-size: 2.5rem;
      }
      p {
        line-height: 1.6;
      }
      code {
        background: #f1f5f9;
        padding: 0.2rem 0.4rem;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>WRO Timeclock</h1>
      <p>This is the initial Cloudflare Pages scaffold for the WRO Timeclock frontend.</p>
      <p>
        The API health check is served by the Worker at <code>/health</code> (configure your
        Pages project to proxy or call the Worker URL).
      </p>
    </main>
  </body>
</html>
