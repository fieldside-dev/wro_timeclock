name = "wro_timeclock"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Runs daily; idempotency ensures payroll only sends once per pay period.
# Adjust schedule as needed for payroll morning timing.
crons = ["0 12 * * *"]

[vars]
TIMEZONE = "America/Toronto"
PAY_PERIOD_ANCHOR_DATE = "2024-01-05"
PAYROLL_SENDER = "payroll@example.com"
PAYROLL_RECIPIENTS = "payroll@example.com"

[[d1_databases]]
binding = "DB"
database_name = "wro_timeclock"
database_id = "REPLACE_WITH_DATABASE_ID"
