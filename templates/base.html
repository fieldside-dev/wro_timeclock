<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Timeclock Admin{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f5f5f5; }
    header { background: #1f2937; color: #fff; padding: 16px; }
    nav a { color: #fff; margin-right: 12px; text-decoration: none; }
    main { padding: 24px; }
    .card { background: #fff; padding: 16px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e5e7eb; }
    .flash { background: #fee2e2; border: 1px solid #fca5a5; padding: 8px; margin-bottom: 12px; border-radius: 6px; }
    .button { display: inline-block; padding: 6px 12px; background: #2563eb; color: #fff; border-radius: 6px; text-decoration: none; border: none; cursor: pointer; }
    .button.secondary { background: #6b7280; }
    .button.danger { background: #dc2626; }
    form.inline { display: inline; }
    .filters { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    label { display: block; margin-top: 8px; font-weight: 600; }
    input[type="text"], input[type="password"], input[type="date"] { padding: 6px 8px; width: 100%; max-width: 320px; border-radius: 6px; border: 1px solid #d1d5db; }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>Timeclock Admin</h1>
      {% if session.admin_id %}
      <nav>
        <a href="{{ url_for('admin_dashboard') }}">Dashboard</a>
        <a href="{{ url_for('admin_users') }}">Users</a>
        <a href="{{ url_for('admin_punches') }}">Punches</a>
        <a href="{{ url_for('admin_anomalies') }}">Anomalies</a>
      </nav>
      <form action="{{ url_for('admin_logout') }}" method="post" class="inline">
        <button class="button secondary" type="submit">Log out</button>
      </form>
      {% endif %}
    </div>
  </header>
  <main>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="flash">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <div class="card">
      {% block content %}{% endblock %}
    </div>
  </main>
</body>
</html>
